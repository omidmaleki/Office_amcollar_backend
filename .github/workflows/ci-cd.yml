name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth_service, owner_service, pet_service, collar_service, sale_service, sms_service, vet_service, gateway]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ${{ matrix.service }}/requirements.txt ]; then pip install -r ${{ matrix.service }}/requirements.txt; fi
          
      - name: Run Tests
        run: |
          cd ${{ matrix.service }}
          # Check for manage.py before running
          if [ -f manage.py ]; then
            python manage.py test
          else
            echo "No manage.py found in ${{ matrix.service }}, skipping tests."
          fi

  lint-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [amcollar-landing, amcollarapp]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci || npm install
          
      - name: Run Lint
        run: |
          cd ${{ matrix.service }}
          npm run lint --if-present

  build-push:
    needs: [test-backend, lint-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - service_name: amcollar-auth
            context: ./auth_service
            dockerfile: Dockerfile
          - service_name: amcollar-owner
            context: ./owner_service
            dockerfile: Dockerfile
          - service_name: amcollar-pet
            context: ./pet_service
            dockerfile: Dockerfile
          - service_name: amcollar-collar
            context: ./collar_service
            dockerfile: Dockerfile
          - service_name: amcollar-sale
            context: ./sale_service
            dockerfile: Dockerfile
          - service_name: amcollar-sms
            context: ./sms_service
            dockerfile: Dockerfile
          - service_name: amcollar-vet
            context: ./vet_service
            dockerfile: Dockerfile
          - service_name: amcollar-gateway
            context: ./gateway
            dockerfile: Dockerfile
          - service_name: amcollar-frontend
            context: ./amcollar-landing
            dockerfile: Dockerfile-pro
          - service_name: amcollar-app-frontend
            context: ./amcollarapp
            dockerfile: Dockerfile-pro

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Calculate Image Tag
        id: meta
        run: |
          # Sanitize branch name
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE_TAG=${BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ matrix.service_name }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ matrix.service_name }}:latest
