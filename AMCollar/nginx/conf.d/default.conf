server {
    listen 80;
    server_name amcollar.com www.amcollar.com;

    # ---------------- Redirect /api to /api/ ----------------
    location = /api {
        return 301 /api/;
    }

    # ---------------- API Proxies (Django Gateway) ----------------
    # All requests starting with /api/ go to gateway service
    location /api/ {
        # Forward to gateway and strip /api/ prefix
        proxy_pass http://gateway:8000/;  # trailing slash is critical
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support WebSockets if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Optional: buffer adjustments
        proxy_buffering off;
    }

    # ---------------- Frontend (Next.js) ----------------
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support WebSockets if frontend uses them
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
    }

    # ---------------- Optional: Static Files ----------------
    # If your Django gateway serves static files (collectstatic)
    # location /static/ {
    #     alias /path/to/static/;
    # }
}
