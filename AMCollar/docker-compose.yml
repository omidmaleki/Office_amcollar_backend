version: "3.8"

services:

  # ---------------- DATABASE ----------------
  db:
    image: postgres:15
    container_name: amcollar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amcollar
    ports:
      - "5432:5432"   # dev only
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    networks:
      - backend

  # ---------------- ZOOKEEPER ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: amcollar-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    expose:
      - "2181"
    networks:
      - backend

  # ---------------- KAFKA ----------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: amcollar-kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"   # dev only
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      retries: 10
    networks:
      - backend

  # ---------------- KAFKA UI ----------------
  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: amcollar-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
# ---------------- redis ----------------
  redis:
    image: redis:7-alpine
    container_name: amcollar-redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # ---------------- AUTH SERVICE ----------------
  auth:
    build: ./auth_service
    container_name: amcollar-auth
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
    command: >
      sh -c "
        sleep 2 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn auth_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    networks:
      - backend

  # ---------------- OWNER SERVICE ----------------
  owner:
    build: ./owner_service
    container_name: amcollar-owner
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
    command: >
      sh -c "
        sleep 2 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn owner_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    networks:
      - backend

  # ---------------- PET SERVICE ----------------
  pet:
    build: ./pet_service
    container_name: amcollar-pet
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
    command: >
      sh -c "
        sleep 2 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn pet_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    networks:
      - backend

  # ---------------- COLLAR SERVICE ----------------
  collar:
    build: ./collar_service
    container_name: amcollar-collar
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
    command: >
      sh -c "
        sleep 4 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn collar_service.wsgi:application \
       --bind 0.0.0.0:8000 \
       --workers 3 \
       --worker-class gevent \
       --timeout 120
      "
    expose:
      - "8000"
    networks:
      - backend

  # ---------------- SALE SERVICE ----------------
  sale:
    build: ./sale_service
    container_name: amcollar-sale
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: >
      sh -c "
        sleep 5 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn sale_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    networks:
      - backend

  # ---------------- SMS SERVICE ----------------
  sms:
    build: ./sms_service
    container_name: amcollar-sms
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        sleep 2 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn sms_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    networks:
      - backend

  # ---------------- VET SERVICE ----------------
  vet:
    build: ./vet_service
    container_name: amcollar-vet
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    command: >
      sh -c "
        sleep 5 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn vet_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    networks:
      - backend

  # ---------------- CELERY BEAT ----------------
  vet-celery-beat:
    build: ./vet_service
    container_name: amcollar-vet-celery-beat
    command: celery -A vet_service beat -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

# ---------------- GATEWAY ----------------
  gateway:
    build: ./gateway
    container_name: amcollar-gateway
    depends_on:
      - auth
      - owner
      - pet
      - collar
      - sale
      - sms
      - vet
    expose:
      - "8000"
    command: >
      sh -c "
        sleep 3 &&
        gunicorn gateway.wsgi:application --bind 0.0.0.0:8000
      "
    networks:
      - backend

  # ---------------- NGINX ----------------
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
      - vet
    networks:
      - backend

  # ---------------- TCP SERVICE ----------------
  tcp_service:
    build: ./tcp_service
    container_name: tcp-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    command: >
      sh -c "
        sleep 5 &&
        python -u /app/tcp_server.py
      "
    restart: always
    networks:
      - backend

  # ---------------- PROCESS SERVICES ----------------
  gyro_service:
    build:
      context: ./process_server
      dockerfile: gyro_service/Dockerfile
    container_name: gyro-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9007:9001"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: gyro_events
    command: >
      sh -c "
        sleep 3 &&
        python -u /app/consumer.py
      "
    restart: always
    networks:
      - backend

  ppg_service:
    build:
      context: ./process_server
      dockerfile: ppg_service/Dockerfile
    container_name: ppg-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9008:9002"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ppg
    command: >
      sh -c "
        sleep 3 &&
        python -u /app/consumer.py
      "
    restart: always
    networks:
      - backend


  gps_service:
    build: ./process_server/gps_service
    container_name: gps-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9009:9003"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: gps
    command: >
      sh -c "
        sleep 3 &&
        python -u /app/location/consumer.py
      "
    restart: always
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge
