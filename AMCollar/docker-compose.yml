version: "3.8"

services:

  # ---------------- DATABASE ----------------
  db:
    image: postgres:15
    container_name: amcollar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amcollar
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # ---------------- ZOOKEEPER & KAFKA ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: amcollar-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: amcollar-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: amcollar-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    # ---------------- REDIS ----------------
  redis:
    image: redis:7-alpine
    container_name: amcollar-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------- AUTH SERVICE ----------------
  auth:
    build: ./auth_service
    container_name: amcollar-auth
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
    command: >
      sh -c "
        sleep 2;
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn auth_service.wsgi:application --bind 0.0.0.0:8000
      "
    ports:
      - "8003:8000"

  # ---------------- OWNER SERVICE ----------------
  owner:
    build: ./owner_service
    container_name: amcollar-owner
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
    command: >
      sh -c "
        sleep 2;
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn owner_service.wsgi:application --bind 0.0.0.0:8000
      "
    ports:
      - "8001:8000"

  # ---------------- PET SERVICE ----------------
  pet:
    build: ./pet_service
    container_name: amcollar-pet
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
    command: >
      sh -c "
        sleep 2;
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn pet_service.wsgi:application --bind 0.0.0.0:8000
      "
    ports:
      - "8002:8000"

  # ---------------- COLLAR SERVICE ----------------
  collar:
    build: ./collar_service
    container_name: amcollar-collar
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
    command: >
      sh -c "
        sleep 2;
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn collar_service.wsgi:application \
       --bind 0.0.0.0:8000 \
       --workers 3 \
       --worker-class gevent \
       --timeout 120
      "
    ports:
      - "8007:8000"

  # ---------------- SALE SERVICE ----------------
  sale:
    build: ./sale_service
    container_name: amcollar-sale
    depends_on:
      - kafka
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: >
      sh -c "
        sleep 8;
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn sale_service.wsgi:application --bind 0.0.0.0:8000
      "
    ports:
      - "8008:8000"

  # ---------------- SMS SERVICE ----------------
  sms:
    build: ./sms_service
    container_name: amcollar-sms
    depends_on:
      - db
    command: >
      sh -c "
        sleep 2;
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn sms_service.wsgi:application --bind 0.0.0.0:8000
      "
    ports:
      - "8004:8000"

  # ---------------- VET SERVICE ----------------
  vet:
    build: ./vet_service
    container_name: amcollar-vet
    env_file:
      - .env
    depends_on:
      - db
      - kafka
      - redis
    entrypoint: ["/app/entrypoint.sh"]
    ports:
      - "8005:8000"

# ---------------- CELERY WORKER ----------------
  vet-celery:
    build: ./vet_service
    container_name: amcollar-vet-celery
    command: celery -A vet_service worker -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

  # ---------------- CELERY BEAT ----------------
  vet-celery-beat:
    build: ./vet_service
    container_name: amcollar-vet-celery-beat
    command: celery -A vet_service beat -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

# ---------------- GATEWAY ----------------
  gateway:
    build: ./gateway
    container_name: amcollar-gateway
    depends_on:
      - owner
      - pet
      - auth
      - collar
      - sale
      - sms
      - vet
    ports:
      - "8000:8000"
    command: >
      sh -c "
        sleep 5 &&
        gunicorn gateway.wsgi:application \
       --bind 0.0.0.0:8000 \
       --workers 3 \
       --worker-class gevent \
       --timeout 120
      "

  # ---------------- TCP SERVICE (optional) ----------------
  tcp_service:
    build: ./tcp_service
    container_name: tcp-service
    depends_on:
      - kafka
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    command: >
      sh -c "
        sleep 5;
        python -u /app/tcp_server.py
      "
    restart: always

  gyro_service:
    build: ./process_server/gyro_service
    container_name: gyro-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9007:9001"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: gyro_events
    command: >
      sh -c "
        sleep 3;
        python -u /app/consumer.py
      "
    restart: always

  ppg_service:
    build: ./process_server/ppg_service
    container_name: ppg-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9008:9002"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ppg
    command: >
      sh -c "
        sleep 3;
        python -u /app/consumer.py
      "
    restart: always

  gps_service:
    build: ./process_server/gps_service
    container_name: gps-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9009:9003"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: gps
    command: >
      sh -c "
        sleep 3;
        python -u /app/location/consumer.py
      "
    restart: always

volumes:
  db_data:
