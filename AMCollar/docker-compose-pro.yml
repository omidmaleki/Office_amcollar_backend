version: "3.8"

services:

  # ---------------- DATABASE ----------------
  db:
    image: postgres:15
    container_name: amcollar-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-amcollar}
    # No external ports in production
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped

  # ---------------- ZOOKEEPER ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: amcollar-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    # No external ports
    networks:
      - backend
    restart: unless-stopped

  # ---------------- KAFKA ----------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: amcollar-kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # No external ports in production
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend
    restart: unless-stopped

  # ---------------- REDIS ----------------
  redis:
    image: redis:7-alpine
    container_name: amcollar-redis
    # No external ports in production
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped

  # ---------------- AUTH SERVICE ----------------
  auth:
    build: ./auth_service
    container_name: amcollar-auth
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-amcollar}
    command: >
      sh -c "
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn auth_service.wsgi:application 
        --bind 0.0.0.0:8000 
        --workers 3 
        --worker-class gevent 
        --timeout 120 
        --max-requests 1000 
        --max-requests-jitter 100
      "
    # No external ports
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- OWNER SERVICE ----------------
  owner:
    build: ./owner_service
    container_name: amcollar-owner
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-amcollar}
    command: >
      sh -c "
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn owner_service.wsgi:application 
        --bind 0.0.0.0:8000 
        --workers 3 
        --worker-class gevent 
        --timeout 120 
        --max-requests 1000 
        --max-requests-jitter 100
      "
    # No external ports
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- PET SERVICE ----------------
  pet:
    build: ./pet_service
    container_name: amcollar-pet
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-amcollar}
    command: >
      sh -c "
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn pet_service.wsgi:application 
        --bind 0.0.0.0:8000 
        --workers 3 
        --worker-class gevent 
        --timeout 120 
        --max-requests 1000 
        --max-requests-jitter 100
      "
    # No external ports
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- COLLAR SERVICE ----------------
  collar:
    build: ./collar_service
    container_name: amcollar-collar
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-amcollar}
    command: >
      sh -c "
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn collar_service.wsgi:application 
        --bind 0.0.0.0:8000 
        --workers 3 
        --worker-class gevent 
        --timeout 120 
        --max-requests 1000 
        --max-requests-jitter 100
      "
    # No external ports
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- SALE SERVICE ----------------
  sale:
    build: ./sale_service
    container_name: amcollar-sale
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-amcollar}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: >
      sh -c "
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn sale_service.wsgi:application 
        --bind 0.0.0.0:8000 
        --workers 3 
        --worker-class gevent 
        --timeout 120 
        --max-requests 1000 
        --max-requests-jitter 100
      "
    # No external ports
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- SMS SERVICE ----------------
  sms:
    build: ./sms_service
    container_name: amcollar-sms
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn sms_service.wsgi:application 
        --bind 0.0.0.0:8000 
        --workers 2 
        --worker-class gevent 
        --timeout 120 &
        celery -A sms_service worker -l info -Q celery --autoscale=2,6 &
        python manage.py run_sms_consumer
      "
    # No external ports
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- VET SERVICE ----------------
  vet:
    build: ./vet_service
    container_name: amcollar-vet
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn vet_service.wsgi:application 
        --bind 0.0.0.0:8000 
        --workers 3 
        --worker-class gevent 
        --timeout 120 
        --max-requests 1000 
        --max-requests-jitter 100
      "
    # No external ports
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- CELERY BEAT ----------------
  vet-celery-beat:
    build: ./vet_service
    container_name: amcollar-vet-celery-beat
    env_file:
      - .env
    command: celery -A vet_service beat -l info --schedule=/tmp/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - celerybeat_data:/tmp
    networks:
      - backend
    restart: unless-stopped

  # ---------------- FRONTEND (Next.js) ----------------
  frontend:
    build:
      context: ./amcollar-landing
      dockerfile: Dockerfile
    container_name: amcollar-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ./amcollar-landing/.next:/app/.next:ro
      - ./amcollar-landing/public:/app/public:ro
    # No external ports - proxied by nginx
    depends_on:
      - gateway
    networks:
      - backend
    restart: unless-stopped

  # ---------------- GATEWAY ----------------
  gateway:
    build: ./gateway
    container_name: amcollar-gateway
    env_file:
      - .env
    depends_on:
      - auth
      - owner
      - pet
      - collar
      - sale
      - sms
      - vet
    command: >
      sh -c "
        gunicorn gateway.wsgi:application 
        --bind 0.0.0.0:8000 
        --workers 3 
        --worker-class gevent 
        --timeout 120 
        --max-requests 1000 
        --max-requests-jitter 100
      "
    # No external ports
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- NGINX ----------------
  nginx:
    image: nginx:alpine
    container_name: amcollar-nginx
    ports:
      - "80:80"
      - "443:443"  # برای SSL در prod
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Optional: SSL certs
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - gateway
      - auth
      - owner
      - pet
      - collar
      - sale
      - sms
      - vet
    networks:
      - backend
    restart: unless-stopped

  # ---------------- TCP SERVICE ----------------
  tcp_service:
    build: ./tcp_service
    container_name: amcollar-tcp-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    command: >
      sh -c "
        python -u /app/tcp_server.py
      "
    networks:
      - backend
    restart: unless-stopped

  # ---------------- PROCESS SERVICES ----------------
  gyro_service:
    build:
      context: ./process_server
      dockerfile: gyro_service/Dockerfile
    container_name: amcollar-gyro-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9007:9001"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: gyro_events
    command: >
      sh -c "
        python -u /app/consumer.py
      "
    networks:
      - backend
    restart: unless-stopped

  ppg_service:
    build:
      context: ./process_server
      dockerfile: ppg_service/Dockerfile
    container_name: amcollar-ppg-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9008:9002"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ppg
    command: >
      sh -c "
        python -u /app/consumer.py
      "
    networks:
      - backend
    restart: unless-stopped

  gps_service:
    build: ./process_server/gps_service
    container_name: amcollar-gps-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9009:9003"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: gps
    command: >
      sh -c "
        python -u /app/location/consumer.py
      "
    networks:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  celerybeat_data:

networks:
  backend:
    driver: bridge