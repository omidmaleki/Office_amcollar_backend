version: "3.8"

services:

  # ---------------- DATABASE ----------------
  db:
    image: postgres:15
    container_name: amcollar-db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    restart: always
    networks:
      - backend

  # ---------------- ZOOKEEPER ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: amcollar-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    restart: always
    networks:
      - backend

  # ---------------- KAFKA ----------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: amcollar-kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      retries: 10
    restart: always
    networks:
      - backend

  # ---------------- KAFKA UI (اختیاری در prod) ----------------
  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: amcollar-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"   # فقط اگر واقعاً نیاز داری
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: always
    networks:
      - backend

  # ---------------- AUTH ----------------
  auth:
    build: ./auth_service
    container_name: amcollar-auth
    env_file: ./auth_service/.env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --no-input &&
        gunicorn auth_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    restart: always
    networks:
      - backend

  # ---------------- OWNER ----------------
  owner:
    build: ./owner_service
    container_name: amcollar-owner
    env_file: ./owner_service/.env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --no-input &&
        gunicorn owner_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    restart: always
    networks:
      - backend

  # ---------------- PET ----------------
  pet:
    build: ./pet_service
    container_name: amcollar-pet
    env_file: ./pet_service/.env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --no-input &&
        gunicorn pet_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    restart: always
    networks:
      - backend

  # ---------------- COLLAR ----------------
  collar:
    build: ./collar_service
    container_name: amcollar-collar
    env_file: ./collar_service/.env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --no-input &&
        gunicorn collar_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    restart: always
    networks:
      - backend

  # ---------------- SMS ----------------
  sms:
    build: ./sms_service
    container_name: amcollar-sms
    env_file: ./sms_service/.env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --no-input &&
        gunicorn sms_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    restart: always
    networks:
      - backend

  # ---------------- SALE ----------------
  sale:
    build: ./sale_service
    container_name: amcollar-sale
    env_file: ./sale_service/.env
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --no-input &&
        gunicorn sale_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    restart: always
    networks:
      - backend

  # ---------------- VET ----------------
  vet:
    build: ./vet_service
    container_name: amcollar-vet
    env_file: ./vet_service/.env
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --no-input &&
        gunicorn vet_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    restart: always
    networks:
      - backend

  # ---------------- GATEWAY ----------------
  gateway:
    build: ./gateway
    container_name: amcollar-gateway
    env_file: ./gateway/.env
    depends_on:
      - auth
      - owner
      - pet
      - collar
      - sale
      - sms
      - vet
    command: >
      sh -c "
        gunicorn gateway.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    restart: always
    networks:
      - backend

  # ---------------- NGINX (EDGE) ----------------
  nginx:
    image: nginx:alpine
    container_name: amcollar-nginx
    ports:
      - "80:80"
      # - "443:443"  # اگر SSL اضافه کنی
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    restart: always
    networks:
      - backend

  # ---------------- TCP SERVICE ----------------
  tcp_service:
    build: ./tcp_service
    container_name: tcp-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "9001-9003:9001-9003"   # فقط چون TCP public است
    command: python -u /app/tcp_server.py
    restart: always
    networks:
      - backend

  # ---------------- PROCESS SERVICES ----------------
  gyro_service:
    build: ./process_server/gyro_service
    container_name: gyro-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: gyro_events
    command: python -u /app/consumer.py
    restart: always
    networks:
      - backend

  ppg_service:
    build: ./process_server/ppg_service
    container_name: ppg-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ppg
    command: python -u /app/consumer.py
    restart: always
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge
