version: "3.8"

services:

  # ---------------- DATABASE ----------------
  db:
    image: postgres:15
    container_name: amcollar-db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5
    restart: always

  # ---------------- ZOOKEEPER ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: amcollar-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    restart: always

  # ---------------- KAFKA ----------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: amcollar-kafka
    depends_on:
      db:
        condition: service_healthy
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      retries: 10
    restart: always

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: amcollar-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: always

  # ---------------- MICROSERVICES ----------------
  auth:
    build: ./auth_service
    container_name: amcollar-auth
    env_file: ./auth_service/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8003:8000"
    command: gunicorn auth_service.wsgi:application --bind 0.0.0.0:8000
    restart: always

  owner:
    build: ./owner_service
    container_name: amcollar-owner
    env_file: ./owner_service/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    command: gunicorn owner_service.wsgi:application --bind 0.0.0.0:8000
    restart: always

  pet:
    build: ./pet_service
    container_name: amcollar-pet
    env_file: ./pet_service/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8000"
    command: gunicorn pet_service.wsgi:application --bind 0.0.0.0:8000
    restart: always

  collar:
    build: ./collar_service
    container_name: amcollar-collar
    env_file: ./collar_service/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8007:8000"
    command: gunicorn collar_service.wsgi:application --bind 0.0.0.0:8000
    restart: always

  sms:
    build: ./sms_service
    container_name: amcollar-sms
    env_file: ./sms_service/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8004:8000"
    command: gunicorn sms_service.wsgi:application --bind 0.0.0.0:8000
    restart: always

  sale:
    build: ./sale_service
    container_name: amcollar-sale
    env_file: ./sale_service/.env
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8008:8000"
    command: gunicorn sale_service.wsgi:application --bind 0.0.0.0:8000
    restart: always

  vet:
    build: ./vet_service
    container_name: amcollar-vet
    env_file: ./vet_service/.env
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8005:8000"
    command: gunicorn vet_service.wsgi:application --bind 0.0.0.0:8000
    restart: always

  gateway:
    build: ./gateway
    container_name: amcollar-gateway
    env_file: ./gateway/.env
    depends_on:
      auth:
        condition: service_started
      owner:
        condition: service_started
      pet:
        condition: service_started
      collar:
        condition: service_started
      sale:
        condition: service_started
      sms:
        condition: service_started
      vet:
        condition: service_started
    ports:
      - "8000:8000"
    command: gunicorn gateway.wsgi:application --bind 0.0.0.0:8000
    restart: always

  tcp_service:
    build: ./tcp_service
    container_name: tcp-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "9001-9003:9001-9003"
    command: python -u /app/tcp_server.py
    restart: always

  gyro_service:
    build: ./process_server/gyro_service
    container_name: gyro-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: gyro_events
    ports:
      - "9007:9001"
    command: python -u /app/consumer.py
    restart: always

  ppg_service:
    build: ./process_server/ppg_service
    container_name: ppg-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ppg
    ports:
      - "9008:9001"
    command: python -u /app/consumer.py
    restart: always

volumes:
  db_data:
  kafka_data:
