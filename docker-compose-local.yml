
services:

  # ---------------- DATABASE ----------------
  db:
    image: postgres:15
    container_name: amcollar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amcollar
    ports:
      - "5432:5432"   # dev only
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    restart: always

  # ---------------- ZOOKEEPER ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: amcollar-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    expose:
      - "2181"
    networks:
      - backend
    restart: always

  # ---------------- KAFKA ----------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: amcollar-kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"   # dev only
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - backend
    restart: always

  # ---------------- KAFKA UI ---------------- (dev tool)
  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: amcollar-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: always

  # ---------------- REDIS ----------------
  redis:
    image: redis:7-alpine
    container_name: amcollar-redis
    ports:
      - "6379:6379"   # dev only (no password for simplicity)
    command: redis-server --appendonly yes  # no password in dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- AUTH SERVICE ----------------
  auth:
    build: ./auth_service
    container_name: amcollar-auth
    env_file:
      - .env  # for custom vars like SMS key
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
      DEBUG: true  # dev mode
    command: >
      sh -c "
        sleep 2 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn auth_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- OWNER SERVICE ----------------
  owner:
    build: ./owner_service
    container_name: amcollar-owner
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
      DEBUG: true
    command: >
      sh -c "
        sleep 2 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        python manage.py collectstatic --no-input &&
        gunicorn owner_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- PET SERVICE ----------------
  pet:
    build: ./pet_service
    container_name: amcollar-pet
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
      DEBUG: true
    command: >
      sh -c "
        sleep 2 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn pet_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- COLLAR SERVICE ----------------
  collar:
    build: ./collar_service
    container_name: amcollar-collar
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
      DEBUG: true
    command: >
      sh -c "
        sleep 4 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn collar_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- SALE SERVICE ----------------
  sale:
    build: ./sale_service
    container_name: amcollar-sale
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DEBUG: true
    command: >
      sh -c "
        sleep 5 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn sale_service.wsgi:application --bind 0.0.0.0:8000
      "
    expose:
      - "8000"
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- SMS SERVICE ----------------
  sms:
    build: ./sms_service
    container_name: amcollar-sms
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SMS_IR_API_KEY: your_api_key_here  # dev placeholder
      DEBUG: true
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        sleep 45 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        gunicorn sms_service.wsgi:application --bind 0.0.0.0:8000 &
        celery -A sms_service worker -l info -Q celery --autoscale=0,4 &
        python manage.py run_sms_consumer
      "
    expose:
      - "8000"
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- VET SERVICE ----------------
  vet:
    build: ./vet_service
    container_name: amcollar-vet
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DEBUG: true
    command: >
      sh -c "
        sleep 5 &&
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        python manage.py collectstatic --no-input &&
        gunicorn vet_service.wsgi:application --bind 0.0.0.0:8000 --workers=2 --worker-class=gevent
      "
    expose:
      - "8000"
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- CELERY BEAT ----------------
  vet-celery-beat:
    build: ./vet_service
    container_name: amcollar-vet-celery-beat
    env_file:
      - .env
    command: celery -A vet_service beat -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- FRONTEND (Next.js) ---------------- (from prod, adapted for dev)
  frontend:
    build:
      context: ./amcollor-landing
      dockerfile: Dockerfile
      target: dev-runner  # dev stage
    container_name: amcollor-frontend
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"  # direct access
    volumes:
      - ./amcollor-landing:/app  # hot reload
      - /app/node_modules  # use container node_modules
    depends_on:
      - gateway
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- GATEWAY ----------------
  gateway:
    build: ./gateway
    container_name: amcollar-gateway
    env_file:
      - .env
    depends_on:
      - auth
      - owner
      - pet
      - collar
      - sale
      - sms
      - vet
    expose:
      - "8000"
    command: >
      sh -c "
        sleep 3 &&
        gunicorn gateway.wsgi:application --bind 0.0.0.0:8000
      "
    environment:
      DEBUG: true
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- NGINX ----------------
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
      - vet
      - frontend  # added for proxy to frontend
    links: # این رو اضافه کن
      - vet
      - gateway
      - auth
      - owner
      - pet
      - collar
      - sale
      - sms
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- TCP SERVICE ----------------
  tcp_service:
    build: ./tcp_service
    container_name: tcp-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    command: >
      sh -c "
        sleep 5 &&
        python -u /app/tcp_server.py
      "
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- PROCESS SERVICES ----------------
  gyro_service:
    build:
      context: ./process_server
      dockerfile: gyro_service/Dockerfile
    container_name: gyro-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9007:9001"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: gyro_events
    command: >
      sh -c "
        sleep 3 &&
        python -u /app/consumer.py
      "
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ppg_service:
    build:
      context: ./process_server
      dockerfile: ppg_service/Dockerfile
    container_name: ppg-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9008:9002"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ppg
    command: >
      sh -c "
        sleep 3 &&
        python -u /app/consumer.py
      "
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gps_service:
    build: ./process_server/gps_service
    container_name: gps-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9009:9003"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: gps
    command: >
      sh -c "
        sleep 3 &&
        python -u /app/location/consumer.py
      "
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:

networks:
  backend:
    driver: bridge