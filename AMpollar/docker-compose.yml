version: "3.9"

services:

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: main
    ports:
      - "5432:5432"

  owner:
    build: ./owner_service
    ports:
      - "8001:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=main
      - DB_USER=admin
      - DB_PASS=admin
      - DEBUG=True
    depends_on:
      - db

  pet:
    build: ./pet_service
    ports:
      - "8002:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=main
      - DB_USER=admin
      - DB_PASS=admin
      - DEBUG=True
    depends_on:
      - db

  sms:
    build: ./sms_service
    ports:
      - "8003:8000"

  auth:
    build: ./auth_service
    ports:
      - "8004:8000"
    depends_on:
      - db
      - sms

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      - owner
      - pet
      - auth
      - sms
