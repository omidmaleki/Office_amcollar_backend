version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ampollar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  owner:
    build: ./owner_service
    container_name: ampollar-owner
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/mydb
    ports:
      - "8001:8000"

  pet:
    build: ./pet_service
    container_name: ampollar-pet
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/mydb
    ports:
      - "8002:8000"

  auth:
    build: ./auth_service
    container_name: ampollar-auth
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/mydb
    ports:
      - "8003:8000"

  gateway:
    build: ./gateway
    container_name: ampollar-gateway
    depends_on:
      - owner
      - pet
      - auth
      - sms
    ports:
      - "8000:8000"

  sms:
    build: ./sms_service
    container_name: ampollar-sms
    depends_on:
      - db
    ports:
      - "8004:8000"

volumes:
  db_data:
