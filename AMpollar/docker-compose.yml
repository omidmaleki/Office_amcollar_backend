version: "3.8"

services:

  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
#      POSTGRES_DB: amcollar
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: amcollar-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list" ]
      interval: 5s
      retries: 10

  # -------------------- Kafka UI ---------------------
  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # ---------------- AUTH SERVICE ----------------
  auth:
    build: ./auth_service
    container_name: amcollar-auth
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
    command: >
      sh -c "
        sleep 2;
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8003:8000"

  # ---------------- OWNER SERVICE ----------------
  owner:
    build: ./owner_service
    container_name: amcollar-owner
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
    command: >
      sh -c "
        sleep 2;
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8001:8000"

  # ---------------- PET SERVICE ----------------
  pet:
    build: ./pet_service
    container_name: amcollar-pet
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
    command: >
      sh -c "
        sleep 2;
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8002:8000"

  # ---------------- PRODUCT SERVICE ----------------
  collar:
    build: ./collar_service
    container_name: amcollar-collar
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
    command: >
      sh -c "
        sleep 2;
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8007:8000"

  # ---------------- ORDER SERVICE ----------------
  order:
    build: ./order_service
    container_name: amcollar-order
    depends_on:
      - db
      - kafka
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: >
      sh -c "
        sleep 3;
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8008:8000"

  order_worker:
    build: ./order_service
    command: python -u -m order.consumer
    environment:
      - PYTHONUNBUFFERED=1

  # ---------------- PAYMENT SERVICE ----------------
  payment:
    build: ./payment_service
    container_name: amcollar-payment
    depends_on:
      - kafka
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/amcollar
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: >
      sh -c "
        sleep 6;
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8009:8000"

  # ---------------- NOTIFICATION SERVICE ----------------
  notification:
    build: ./notification_service
    container_name: amcollar-notification
    depends_on:
      - kafka
      - redis
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: >
      sh -c "
        sleep 2;
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8010:8000"

  # ---------------- SMS SERVICE ----------------
  sms:
    build: ./sms_service
    container_name: amcollar-sms
    depends_on:
      - db
    command: >
      sh -c "
        sleep 2;
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8004:8000"

  # ---------------- VET SERVICE ----------------
  vet:
    build: ./vet_service
    container_name: amcollar-vet
    depends_on:
      - db
      - kafka
    environment:
      REDIS_HOST: redis
    command: >
      sh -c "
        sleep 2;
        python manage.py makemigrations --no-input &&
        python manage.py migrate --no-input &&
        python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8005:8000"

  vet_worker:
    build: ./vet_service
    container_name: amcollar-vet-worker
    command: python manage.py consume_purchase_events
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis


  gateway:
    build: ./gateway
    container_name: amcollar-gateway
    depends_on:
      - owner
      - pet
      - auth
      - collar
      - payment
      - order
      - notification
      - sms
    ports:
      - "8000:8000"


  # ---------------- TCP CLIENT ----------------
  tcp_service:
    build: ./tcp_service
    container_name: tcp-service
    depends_on:
      - kafka
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TCP_PORTS: "9001,9002,9003"
    command: >
      sh -c "
        sleep 3;
        python -u /app/tcp_server.py
      "
    restart: always

volumes:
  db_data:


