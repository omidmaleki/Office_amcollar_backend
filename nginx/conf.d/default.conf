map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream auth_backend { server auth:8000; }
upstream owner_backend { server owner:8000; }
upstream pet_backend { server pet:8000; }
upstream collar_backend { server collar:8000; }
upstream sale_backend { server sale:8000; }
upstream sms_backend { server sms:8000; }
upstream vet_backend { server vet:8000; }
upstream gateway_backend { server gateway:8000; }
upstream frontend_backend { server frontend:3000; }
upstream app_frontend_backend { server app-frontend:3000; }

server {
    listen 80;
    server_name amcollar.com www.amcollar.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name amcollar.com www.amcollar.com;

    ssl_certificate /etc/letsencrypt/live/amcollar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amcollar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;  # ECDSA-only, no DHE
    ssl_ecdh_curve prime256v1:secp384r1:x25519;  # P-256 اول (match cert)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # TLS1.3 ciphersuites
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

    # Signature algorithms (SHA384 match)
    ssl_conf_command SignatureAlgorithms ECDSA+SHA256:ECDSA+SHA384;

    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 10s;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;


#### vet media and static files
# Optional: redirect without trailing slash → with trailing slash (good practice)
location = /svet/admin/static {
    return 301 /svet/admin/static/;
}
location = /sowner/admin/static {
    return 301 /sowner/admin/static/;
}

location = /media/vet {
    return 301 /media/vet/;
}
# This is the important one – prefix match + alias
location /sowner/admin/static/ {
    alias /opt/amcollar/staticfiles/;

    autoindex off;                      # no directory listing
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";

    # Optional: block path traversal attempts
    location ~* \.\. {
        return 403;
    }

    # Helpful for debugging at first
    access_log /var/log/nginx/amcollar-svet-static.log;
    # error_log  /var/log/nginx/amcollar-svet-static-error.log warn;   # optional
}

location /svet/admin/static/ {
    alias /opt/amcollar/staticfiles/;

    autoindex off;                      # no directory listing
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";

    # Optional: block path traversal attempts
    location ~* \.\. {
        return 403;
    }

    # Helpful for debugging at first
    access_log /var/log/nginx/amcollar-svet-static.log;
    # error_log  /var/log/nginx/amcollar-svet-static-error.log warn;   # optional
}

location /media/vet/ {
    alias /opt/amcollar/media/vet/;     # ← اسلش انتهایی خیلی مهم است

    autoindex off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    client_max_body_size 500M;
}

