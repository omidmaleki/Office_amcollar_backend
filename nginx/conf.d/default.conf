server {
    listen 443 ssl;
    http2 on;
    server_name app.amcollar.com ;

    ssl_certificate /etc/letsencrypt/live/amcollar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amcollar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;  # ECDSA-only, no DHE
    ssl_ecdh_curve prime256v1:secp384r1:x25519;  # P-256 اول (match cert)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # TLS1.3 ciphersuites
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

    # Signature algorithms (SHA384 match)
    ssl_conf_command SignatureAlgorithms ECDSA+SHA256:ECDSA+SHA384;

    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 10s;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://app_frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}